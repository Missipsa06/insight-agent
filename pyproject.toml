[project]
name = "insight-agent"
version = "0.1.0"
description = "Agent analyste études de marché sur données de panel d'achats"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "numpy>=2.0",
    "openai>=3.31.0",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insight_agent"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# textes de prompt : les phrases ne se coupent pas pour une limite de largeur de code
"src/insight_agent/text_to_sql.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
